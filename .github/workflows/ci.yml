name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v1.64.8

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the action with a threshold below the expected score
        id: pass
        uses: ./
        with:
          threshold: 50

      - name: Run the action with a threshold above any possible score
        id: fail
        uses: ./
        continue-on-error: true
        with:
          threshold: 100
          format: markdown

      - name: Check outputs and threshold behaviour
        env:
          SCORE: ${{ steps.pass.outputs.score }}
          GRADE: ${{ steps.pass.outputs.grade }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
        run: |
          echo "score=${SCORE} grade=${GRADE} fail_outcome=${FAIL_OUTCOME}"
          case "$SCORE" in
            ''|*[!0-9]*) echo "score output is not an integer"; exit 1 ;;
          esac
          if [ "$SCORE" -gt 100 ]; then echo "score output is out of range"; exit 1; fi
          case "$GRADE" in
            A+|A|A-|B+|B|B-|C+|C|C-|D|F) ;;
            *) echo "unexpected grade output: ${GRADE}"; exit 1 ;;
          esac
          if [ "$FAIL_OUTCOME" != "failure" ]; then
            echo "a threshold of 100 should have failed the action"; exit 1
          fi

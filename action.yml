name: 'RepoHealth Check'
description: 'Analyze repository health and produce a score'
branding:
  icon: 'activity'
  color: 'green'

inputs:
  threshold:
    description: 'Minimum passing score (0-100). 0 disables the threshold check.'
    required: false
    default: '0'
  format:
    description: 'Output format: terminal, json, markdown, html'
    required: false
    default: 'terminal'
  version:
    description: 'RepoHealth release to install, as a Go module version (for example v0.5.3)'
    required: false
    default: 'v0.5.3'

outputs:
  score:
    description: 'Health score (0-100)'
    value: ${{ steps.run.outputs.score }}
  grade:
    description: 'Letter grade (A+ to F)'
    value: ${{ steps.run.outputs.grade }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 'stable'
        cache: false

    - name: Install RepoHealth
      shell: bash
      env:
        REPOHEALTH_VERSION: ${{ inputs.version }}
      run: go install "github.com/spbuilds/repohealth/cmd/repohealth@${REPOHEALTH_VERSION}"

    - name: Run RepoHealth
      id: run
      shell: bash
      env:
        REPOHEALTH_FORMAT: ${{ inputs.format }}
        REPOHEALTH_THRESHOLD: ${{ inputs.threshold }}
      run: |
        case "$REPOHEALTH_THRESHOLD" in
          ''|*[!0-9]*)
            echo "::error::threshold must be an integer between 0 and 100 (got '${REPOHEALTH_THRESHOLD}')"
            exit 1
            ;;
        esac
        if [ "$REPOHEALTH_THRESHOLD" -gt 100 ]; then
          echo "::error::threshold must be an integer between 0 and 100 (got '${REPOHEALTH_THRESHOLD}')"
          exit 1
        fi

        # --score-only prints a single line such as "81/100 (B+)"
        SUMMARY="$(repohealth . --score-only)"
        SCORE="${SUMMARY%%/*}"
        GRADE="${SUMMARY##*(}"
        GRADE="${GRADE%)}"
        echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
        echo "grade=${GRADE}" >> "$GITHUB_OUTPUT"

        if [ "$REPOHEALTH_FORMAT" = "terminal" ]; then
          repohealth .
        else
          repohealth . --format "$REPOHEALTH_FORMAT"
        fi

        if [ "$REPOHEALTH_THRESHOLD" -gt 0 ] && [ "$SCORE" -lt "$REPOHEALTH_THRESHOLD" ]; then
          echo "::error::RepoHealth score ${SCORE} is below threshold ${REPOHEALTH_THRESHOLD}"
          exit 2
        fi
